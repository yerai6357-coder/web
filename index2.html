<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus | La Red Definitiva</title>
    <link rel="stylesheet" href="style2.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app-container" class="app-container">
        
        <aside class="sidebar-left">
            <div class="logo">
                <h2>Nexus<span>.</span></h2>
            </div>
            <nav class="nav-menu">
                <button class="nav-btn active" data-target="feed-view">
                    <span class="icon">🏠</span> <span class="label">Inicio</span>
                </button>
                <button class="nav-btn" data-target="reels-view">
                    <span class="icon">📱</span> <span class="label">Reels</span>
                </button>
                <button class="nav-btn" data-target="communities-view">
                    <span class="icon">🪐</span> <span class="label">Comunidades</span>
                </button>
                <button class="nav-btn" data-target="notifications-view">
                    <span class="icon">🔔</span> <span class="label">Notificaciones</span>
                </button>
                <button class="nav-btn" data-target="profile-view">
                    <span class="icon">👤</span> <span class="label">Perfil</span>
                </button>
            </nav>
            <button class="post-btn-main">Publicar</button>
            
            <div class="user-mini-profile">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Admin" alt="Admin Avatar" class="avatar">
                <div class="user-info">
                    <strong>@admin_sys</strong>
                    <span>Nivel 42</span>
                </div>
                <button id="theme-toggle" class="icon-btn">🌓</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="mobile-logo">Nexus.</div>
                <div class="feed-filters">
                    <button class="filter-btn active">Para ti</button>
                    <button class="filter-btn">Siguiendo</button>
                    <button class="filter-btn">Rachas 🔥</button>
                </div>
            </header>

            <div id="dynamic-content-area" class="content-area">
                </div>
        </main>

        <aside class="sidebar-right">
            <div class="search-bar">
                <span class="search-icon">🔍</span>
                <input type="text" placeholder="Buscar en Nexus...">
            </div>

            <div class="widget trending-widget">
                <h3>Tendencias globales</h3>
                <ul id="trending-list" class="trend-list">
                    </ul>
            </div>

            <div class="widget suggestions-widget">
                <h3>A quién seguir</h3>
                <ul id="suggestions-list" class="suggestion-list">
                    </ul>
            </div>
            
            <footer class="side-footer">
                <p>&copy; 2026 Nexus System. Self-Hosted Edition.</p>
            </footer>
        </aside>

        <nav class="bottom-nav">
            <button class="nav-btn active" data-target="feed-view">🏠</button>
            <button class="nav-btn" data-target="communities-view">🪐</button>
            <button class="nav-btn post-btn-mobile">➕</button>
            <button class="nav-btn" data-target="reels-view">📱</button>
            <button class="nav-btn" data-target="profile-view">👤</button>
        </nav>
    </div>

    <div id="compose-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Crear publicación</h3>
                <button class="close-btn" onclick="toggleModal('compose-modal')">✖</button>
            </div>
            <textarea placeholder="¿Qué está pasando?"></textarea>
            <div class="modal-actions">
                <div class="media-options">
                    <button>📷</button>
                    <button>🎥</button>
                    <button>📊</button>
                </div>
                <button class="btn-primary">Publicar</button>
            </div>
        </div>
    </div>

    <script src="script2.js"></script>
</body>
</html>
